plugins {
    id "com.android.application"
}

android {
    namespace "com.sproutsquad.gardenbrawl"
    compileSdk 35

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/gameAssets"))
    }

    defaultConfig {
        applicationId "com.sproutsquad.gardenbrawl"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.register("syncGameAssets", Sync) {
    from(rootProject.projectDir) {
        include "index.html", "style.css", "game.js", "favicon.svg"
    }
    into(layout.buildDirectory.dir("generated/gameAssets/www"))
}

tasks.named("preBuild").configure {
    dependsOn("syncGameAssets")
}
